services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: katherbox-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - DB_PATH=/app/data/katherbox.db
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-katherbox}
      - DB_PASSWORD=${DB_PASSWORD:-katherbox_secret}
      - DB_NAME=${DB_NAME:-katherbox}
      - REDIS_ADDR=redis:6379
      - GIN_MODE=release
      - ALLOWED_ORIGINS=*
      # Change this for any real deployment — this default only exists so
      # `docker compose up` works out of the box for local/demo use.
      - JWT_SECRET=${JWT_SECRET:-katherbox_docker_default_change_me}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: katherbox-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: katherbox-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: katherbox-postgres
    restart: unless-stopped
    profiles:
      - postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=katherbox
      - POSTGRES_PASSWORD=katherbox_secret
      - POSTGRES_DB=katherbox
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: katherbox-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: katherbox-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
