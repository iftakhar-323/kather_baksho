services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kather_baksho-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - DB_PATH=/app/data/kather_baksho.db
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-kather_baksho}
      - DB_PASSWORD=${DB_PASSWORD:-kather_baksho_secret}
      - DB_NAME=${DB_NAME:-kather_baksho}
      - REDIS_ADDR=redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=kather_baksho_iot
      - WORKER_TS_URL=http://worker-ts:8083
      - GIN_MODE=release
      - ALLOWED_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET:-kather_baksho_docker_default_change_me}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      worker-ts:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/metrics`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"

  worker-ts:
    build:
      context: ./services/worker-ts
      dockerfile: Dockerfile
    container_name: kather_baksho-worker-ts
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.worker.rule=PathPrefix(`/worker`)"
      - "traefik.http.routers.worker.entrypoints=web"
      - "traefik.http.routers.worker.priority=20"
      - "traefik.http.middlewares.worker-stripprefix.stripprefix.prefixes=/worker"
      - "traefik.http.routers.worker.middlewares=worker-stripprefix"
      - "traefik.http.services.worker.loadbalancer.server.port=8083"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kather_baksho-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  traefik:
    image: traefik:v3.1
    container_name: kather_baksho-traefik
    restart: unless-stopped
    ports:
      - "8085:80"
      - "8086:8080"
    volumes:
      - ./monitoring/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./monitoring/traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
    depends_on:
      - backend
      - frontend

  redis:
    image: redis:7-alpine
    container_name: kather_baksho-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: kather_baksho-postgres
    restart: unless-stopped
    profiles:
      - postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=kather_baksho
      - POSTGRES_PASSWORD=kather_baksho_secret
      - POSTGRES_DB=kather_baksho
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kather_baksho-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: kather_baksho-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  mongo:
    image: mongo:7.0
    container_name: kather_baksho-mongo
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
